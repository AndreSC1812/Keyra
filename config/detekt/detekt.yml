# Overrides on top of the default detekt configuration (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  ComplexCondition:
    threshold: 5
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 20
    ignoreAnnotatedFunctions: ['Composable', 'Preview']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/ui/theme/**']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 5
  ThrowsCount:
    max: 5
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
