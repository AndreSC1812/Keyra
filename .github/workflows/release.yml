name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The keystore only exists as a base64 GitHub secret; nothing is stored in the repo.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYRA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keyra-release.jks"
          echo "KEYRA_KEYSTORE_PATH=$RUNNER_TEMP/keyra-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYRA_KEYSTORE_PASSWORD: ${{ secrets.KEYRA_KEYSTORE_PASSWORD }}
          KEYRA_KEY_ALIAS: ${{ secrets.KEYRA_KEY_ALIAS }}
          KEYRA_KEY_PASSWORD: ${{ secrets.KEYRA_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "keyra-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: keyra-${{ github.ref_name }}.apk
          generate_release_notes: true
